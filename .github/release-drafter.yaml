name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
tag-prefix: 'v'

change-template: '* $TITLE by $AUTHORS in $URL'
change-title-escapes: '\<*_&@'

categories:
  - title: 'Breaking Changes'
    exclusive: true
    when:
      label: 'semver:major'
  - title: 'Features'
    when:
      label: 'feature'
  - title: 'Bug Fixes'
    when:
      label: 'fix'
  - title: 'Documentation'
    when:
      label: 'documentation'
  - title: 'Dependencies'
    when:
      label: 'dependencies'
  - title: 'Other Changes'

  - type: 'version-resolver'
    semver-increment: 'minor'
    when:
      labels:
        - 'semver:major'
        - 'semver:minor'
  - type: 'version-resolver'
    semver-increment: 'patch'
    when:
      label: 'semver:patch'
  - type: 'version-resolver'
    semver-increment: 'patch'

template: |
  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
