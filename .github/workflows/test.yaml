name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd

      - name: Run tests
        run: dub test
